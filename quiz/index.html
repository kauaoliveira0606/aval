  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(/fonts/inter-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(/fonts/inter-latin.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }

    .qz{--gold:#f2c14e;--gold-dim:#d9a93b;--gold-ink:#9c700c;--cream:#fbf8f1;--ink:#111111;--line:#e6dbc2;--red:#d63c3c;
      min-height:100vh;background:#fff;color:var(--ink);
      font-family:'Inter',-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;overflow-x:hidden;position:relative;}
    *{box-sizing:border-box;}
    body{margin:0;background:#fff;}
    .qz-bar{position:sticky;top:0;background:#fff;z-index:10;padding:16px 20px 6px;width:100%;}
    .qz-bar-track{width:100%;max-width:520px;margin:0 auto;height:10px;background:#efe8d8;border-radius:99px;overflow:hidden;}
    .qz-bar-fill{height:100%;background:var(--ink);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
    .qz-back{position:absolute;top:46px;left:16px;z-index:11;width:40px;height:40px;border-radius:50%;
      border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;
      display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);
      transition:transform .12s ease,border-color .15s ease;font-family:inherit;}
    .qz-back.show{display:flex;}
    .qz-back:hover{border-color:var(--gold-dim);}
    .qz-back:active{transform:scale(.92);}
    .qz-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 20px 56px;}
    .qz-screen{width:100%;max-width:520px;margin:0 auto;text-align:center;animation:qin .24s cubic-bezier(.16,1,.3,1);}
    .qz-center{display:flex;flex-direction:column;align-items:center;}
    @keyframes qin{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
    @media(prefers-reduced-motion:reduce){.qz-screen{animation:none;}}

    /* intro */
    .qz-intro{padding-top:3vh;}
    .qz-logo{height:60px;width:auto;display:block;margin:0 auto 18px;}
    .qz-hero{width:100%;max-width:440px;aspect-ratio:4/5;object-fit:cover;object-position:center 25%;border-radius:18px;
      margin:22px auto 6px;display:block;box-shadow:0 16px 44px rgba(0,0,0,.16);}
    .qz-hl{background:var(--gold);color:#0a0a0a;padding:.02em .16em;border-radius:7px;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
    .qz-h1{font-weight:800;font-size:clamp(26px,6vw,38px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;}
    .qz-sub{font-size:17px;color:var(--ink);margin:0 0 26px;}
    .qz-proof{font-size:14px;color:var(--ink);margin:16px 0 0;}
    .qz-disc{font-size:11px;line-height:1.6;color:#444;margin:26px auto 0;max-width:440px;}
    .qz-disc a{color:#444;}

    /* question */
    .qz-q{font-weight:800;font-size:clamp(21px,4.6vw,27px);line-height:1.14;letter-spacing:-.01em;margin:0 0 8px;}
    .qz-qsub{font-size:14px;color:#444;font-style:italic;margin:0 0 22px;}
    .qz-congrats{font-size:clamp(24px,5.2vw,32px);line-height:1.12;margin:0 0 16px;}
    .qz-accent{color:var(--gold-ink);font-weight:700;font-size:16px;line-height:1.4;margin:0 0 26px;max-width:440px;}
    .qz-commit{font-weight:800;font-size:19px;margin:8px 0 16px;}

    /* options */
    .qz-opts{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
    .qz-opts-2{flex-direction:row;gap:14px;}
    .qz-opts-2 .qz-opt{flex:1;flex-direction:column;justify-content:center;padding:26px 12px;gap:10px;text-align:center;}
    .qz-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
      border-radius:16px;padding:18px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
      transition:transform .12s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease;}
    .qz-opt:hover{border-color:var(--gold-dim);}
    .qz-opt:active{transform:scale(.98);}
    .qz-opt.on{border-color:var(--gold-dim);background:var(--cream);box-shadow:0 6px 18px rgba(217,169,59,.22);}
    .qz-badge{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:#f4eedf;display:flex;align-items:center;justify-content:center;
      font-size:18px;font-weight:700;color:var(--gold-ink);}
    .qz-opts-2 .qz-badge{width:44px;height:44px;font-size:26px;}
    .qz-check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid #d8ccb0;transition:all .15s ease;}
    .qz-check.on{background:var(--gold-dim);border-color:var(--gold-dim);box-shadow:inset 0 0 0 3px #fff;}

    /* yes/no */
    .qz-yn{display:flex;gap:14px;width:100%;}
    .qz-yn .qz-opt{justify-content:center;font-weight:700;}
    .qz-yes.qz-opt{border-color:#16a34a55;}

    /* cta */
    .qz-cta{margin-top:26px;width:100%;max-width:420px;background:linear-gradient(180deg,var(--gold),var(--gold-dim));color:#0a0a0a;border:none;
      border-radius:16px;padding:18px 24px;font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.01em;cursor:pointer;
      box-shadow:0 12px 28px rgba(217,169,59,.38);transition:transform .12s ease,filter .15s ease;}
    .qz-cta:hover{filter:brightness(1.04);}
    .qz-cta:active{transform:scale(.98);}
    .qz-cta:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;}
    .qz-continue{margin-top:18px;}

    /* analyzing */
    .qz-load-head{display:flex;justify-content:space-between;width:100%;max-width:420px;font-weight:700;font-size:15px;margin-bottom:10px;}
    .qz-load-track{width:100%;max-width:420px;height:12px;background:#efe8d8;border-radius:99px;overflow:hidden;}
    .qz-load-fill{height:100%;background:var(--ink);border-radius:99px;transition:width .1s linear;}
    .qz-load-card{width:100%;max-width:420px;margin-top:16px;padding:18px;border-radius:14px;background:var(--gold);color:#0a0a0a;font-weight:700;
      opacity:0;transform:translateY(8px);transition:all .3s ease;}
    .qz-load-card.soft{background:#f4eedf;border:1px solid var(--line);}
    .qz-load-card.on{opacity:1;transform:none;}

    /* reveal */
    .qz-count{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
    .qz-count-box{background:#fde7e7;border-radius:12px;padding:8px 14px;text-align:center;min-width:56px;}
    .qz-count-box b{display:block;font-size:26px;font-weight:800;color:#d63c3c;line-height:1;}
    .qz-count-box span{font-size:11px;color:#d63c3c;}
    .qz-count-sep{font-size:26px;font-weight:800;color:#d63c3c;}
    .qz-graph{position:relative;width:100%;max-width:460px;margin:20px auto 8px;border-radius:16px;overflow:hidden;background:var(--cream);border:1px solid var(--line);}
    .qz-graph svg{width:100%;height:auto;display:block;}
    .qz-node{position:absolute;font-size:11px;color:#444;line-height:1.3;text-align:left;}
    .qz-node b{color:var(--ink);font-size:13px;}
    .qz-node-a{left:4%;bottom:7%;}
    .qz-node-b{right:4%;top:5%;text-align:right;}
    @media(max-width:420px){.qz-node{font-size:10px;}.qz-node b{font-size:11px;}}
    @media(max-width:520px){
      .qz-bar{padding:13px 16px 6px;}
      .qz-back{top:40px;left:12px;width:38px;height:38px;font-size:19px;}
      .qz-stage{padding:22px 16px 52px;}
      .qz-opts-2 .qz-opt{padding:22px 8px;}
    }
  </style>
</head>
<body>
  <div class="qz">
    <div class="qz-bar"><div class="qz-bar-track"><div class="qz-bar-fill" id="bar" style="width:0%"></div></div></div>
    <button class="qz-back" id="back" type="button" aria-label="Go back">&larr;</button>
    <div class="qz-stage" id="stage"></div>
  </div>

  <script>
  (function () {
    // ===== Where the quiz sends people at the end (UTMs and fbclid are carried over) =====
    var NEXT_URL = '/ai-paid';

    var DISC = '18+ only. Educational training, not financial advice and not a guarantee of income. Trading futures involves substantial risk of loss and is not suitable for everyone. Results vary. Affiliate disclosure: Mind Over Market earns a commission when you activate the AI tools we recommend, which is how this training stays free.';

    var QUESTIONS = [
      { kind: 'single', key: 'gender', title: 'You are?', options: [
        { emoji: '🧔', label: 'Man', value: 'man' },
        { emoji: '👩', label: 'Woman', value: 'woman' } ] },
      { kind: 'single', key: 'age', title: 'How old are you?', options: [
        { emoji: 'A', label: '18 - 25', value: '18-25' },
        { emoji: 'B', label: '26 - 35', value: '26-35' },
        { emoji: 'C', label: '36 - 45', value: '36-45' },
        { emoji: 'D', label: '46+', value: '46+' } ] },
      { kind: 'single', key: 'goal', title: "What's your main trading goal right now?", options: [
        { emoji: '🏆', label: 'Pass my first prop firm evaluation', value: 'pass-eval' },
        { emoji: '💸', label: 'Get consistent payouts', value: 'consistent-payouts' },
        { emoji: '🛑', label: 'Stop blowing accounts', value: 'stop-blowing' },
        { emoji: '🏠', label: 'Replace my 9-to-5 income', value: 'replace-job' },
        { emoji: '🧠', label: 'Trade my plan, not my emotions', value: 'trade-plan' } ] },
      { kind: 'multi', key: 'struggle', title: "What's getting in the way right now?", sub: 'Pick all that apply.', options: [
        { label: 'I break my own rules', value: 'break-rules' },
        { label: 'I revenge trade after a loss', value: 'revenge-trade' },
        { label: 'I hesitate on good setups', value: 'hesitate' },
        { label: 'I keep failing evaluations', value: 'fail-evals' },
        { label: "I don't have a clear plan", value: 'no-plan' } ] },
      { kind: 'single', key: 'experience', title: 'Have you tried a prop firm challenge before?', options: [
        { emoji: '🌱', label: 'Never, this would be my first', value: 'never' },
        { emoji: '🔁', label: 'Tried, but I blew it', value: 'blew-it' },
        { emoji: '😮‍💨', label: 'Passed, then lost the funded account', value: 'lost-funded' },
        { emoji: '📈', label: "Yes, I've gotten paid out", value: 'paid-out' } ] },
      { kind: 'single', key: 'time', title: 'How much time per day can you put into trading?', options: [
        { emoji: '⏱️', label: '10-30 min (start slow)', value: '10-30m' },
        { emoji: '🔥', label: '1-2 hours (ideal for progress)', value: '1-2h' },
        { emoji: '💪', label: '2-3 hours (serious)', value: '2-3h' },
        { emoji: '🚀', label: '4+ hours (all in)', value: '4h+' } ] }
    ];
    var ANALYZE = 2 + QUESTIONS.length, REVEAL = ANALYZE + 1;

    var step = 0, answers = {}, multiSel = [], locked = false, timers = [];
    var stage = document.getElementById('stage'), bar = document.getElementById('bar'), back = document.getElementById('back');

    function track(name, data) { try { if (typeof window.fbq === 'function') window.fbq('trackCustom', name, data || {}); } catch (e) {} }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function clearTimers() { timers.forEach(function (t) { clearInterval(t); clearTimeout(t); cancelAnimationFrame(t); }); timers = []; }
    function next() { go(Math.min(step + 1, REVEAL)); }
    back.onclick = function () { multiSel = []; go(Math.max(0, step - 1)); };

    function stepName(p) { return p === 0 ? 'intro' : p === 1 ? 'commit' : p === ANALYZE ? 'analyzing' : p === REVEAL ? 'reveal' : QUESTIONS[p - 2].key; }

    function go(p) {
      clearTimers();
      step = p; locked = false;
      bar.style.width = Math.min(100, Math.round((p + 1) / (REVEAL + 1) * 100)) + '%';
      back.classList.toggle('show', p >= 1 && p < ANALYZE);
      track('QuizStep', { index: p, name: stepName(p) });
      window.scrollTo({ top: 0 });
      render();
    }

    function render() {
      var p = step, h = '';
      if (p === 0) {
        h = '<div class="qz-screen qz-intro">' +
          '<img class="qz-logo" src="/images/logo-gold-clear.webp" alt="Mind Over Market">' +
          '<h1 class="qz-h1">Discover The <mark class="qz-hl">Execution System</mark> That Makes You Actually Follow Your Trading Plan</h1>' +
          '<p class="qz-sub">Finish this quick quiz to unlock your free training at the end.</p>' +
          '<img class="qz-hero" src="/images/benicio-headshot.webp" alt="Benicio">' +
          '<button class="qz-cta" id="start" type="button">START NOW &rarr;</button>' +
          '<p class="qz-proof">⚡ 1,000+ traders are already inside</p>' +
          '<p class="qz-disc">' + DISC + '</p></div>';
      } else if (p === 1) {
        h = '<div class="qz-screen qz-center">' +
          '<h2 class="qz-q qz-congrats">🎁 Congrats! You\'re getting a special free gift at the end of this quiz.</h2>' +
          '<p class="qz-accent">Want the free gift? Finish the next few steps to unlock it.</p>' +
          '<p class="qz-commit">Do you commit to finishing this quick quiz?</p>' +
          '<div class="qz-yn"><button class="qz-opt qz-yes" data-yn type="button">✅ Yes</button><button class="qz-opt qz-no" data-yn type="button">🚫 No</button></div></div>';
      } else if (p < ANALYZE) {
        var q = QUESTIONS[p - 2];
        h = '<div class="qz-screen"><h2 class="qz-q">' + esc(q.title) + '</h2>' + (q.sub ? '<p class="qz-qsub">' + esc(q.sub) + '</p>' : '');
        if (q.kind === 'single') {
          h += '<div class="qz-opts' + (q.key === 'gender' ? ' qz-opts-2' : '') + '">' + q.options.map(function (o) {
            return '<button class="qz-opt" type="button" data-v="' + esc(o.value) + '">' + (o.emoji ? '<span class="qz-badge">' + o.emoji + '</span>' : '') + '<span>' + esc(o.label) + '</span></button>';
          }).join('') + '</div>';
        } else {
          h += '<div class="qz-opts">' + q.options.map(function (o) {
            var on = multiSel.indexOf(o.value) >= 0 ? ' on' : '';
            return '<button class="qz-opt' + on + '" type="button" data-m="' + esc(o.value) + '"><span class="qz-check' + on + '"></span><span>' + esc(o.label) + '</span></button>';
          }).join('') + '</div><button class="qz-cta qz-continue" id="cont" type="button"' + (multiSel.length ? '' : ' disabled') + '>Continue &rarr;</button>';
        }
        h += '</div>';
      } else if (p === ANALYZE) {
        h = '<div class="qz-screen qz-center">' +
          '<div class="qz-load-head"><span>Analyzing your answers</span><span id="pct">0%</span></div>' +
          '<div class="qz-load-track"><div class="qz-load-fill" id="lfill" style="width:0%"></div></div>' +
          '<div class="qz-load-card" id="c1">Building your personalized trading plan</div>' +
          '<div class="qz-load-card soft" id="c2">Setting up your free access</div></div>';
      } else {
        h = '<div class="qz-screen qz-center">' +
          '<div class="qz-count"><div class="qz-count-box"><b>00</b><span>min</span></div><div class="qz-count-sep">:</div><div class="qz-count-box"><b id="sec">30</b><span>sec</span></div></div>' +
          '<h2 class="qz-q">Your Free Training Is Ready</h2>' +
          '<p class="qz-qsub">Based on your answers, here\'s the path we mapped for you.</p>' +
          '<div class="qz-graph">' +
            '<svg viewBox="0 0 460 280" role="img" aria-label="Your 30-day path">' +
              '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16a34a" stop-opacity=".28"/><stop offset="1" stop-color="#16a34a" stop-opacity="0"/></linearGradient></defs>' +
              '<g stroke="#e6dbc2" stroke-width="1"><line x1="0" y1="70" x2="460" y2="70"/><line x1="0" y1="140" x2="460" y2="140"/><line x1="0" y1="210" x2="460" y2="210"/></g>' +
              '<path d="M40 200 C 100 196, 130 180, 180 175 S 260 150, 300 128 S 370 98, 420 88 L420 280 L40 280 Z" fill="url(#g)"/>' +
              '<path d="M40 200 C 100 196, 130 180, 180 175 S 260 150, 300 128 S 370 98, 420 88" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>' +
              '<circle cx="40" cy="200" r="8" fill="#fff" stroke="#d63c3c" stroke-width="4"/>' +
              '<circle cx="420" cy="88" r="8" fill="#fff" stroke="#16a34a" stroke-width="4"/>' +
            '</svg>' +
            '<span class="qz-node qz-node-a">TODAY<br><b>Guessing on every trade</b></span>' +
            '<span class="qz-node qz-node-b">30 DAYS<br><b>Following your plan every session</b></span>' +
          '</div>' +
          '<button class="qz-cta" id="unlock" type="button">UNLOCK MY FREE ACCESS</button>' +
          '<p class="qz-disc">' + DISC + ' See our <a href="/privacy">Privacy Policy</a> and <a href="/terms">Terms</a>.</p></div>';
      }
      stage.innerHTML = h;
      wire();
    }

    function wire() {
      var p = step;
      if (p === 0) {
        document.getElementById('start').onclick = function () { track('QuizStart', {}); next(); };
      } else if (p === 1) {
        stage.querySelectorAll('[data-yn]').forEach(function (b) { b.onclick = next; });
      } else if (p < ANALYZE) {
        var q = QUESTIONS[p - 2];
        if (q.kind === 'single') {
          stage.querySelectorAll('[data-v]').forEach(function (b) {
            b.onclick = function () {
              if (locked) return; locked = true;
              var v = b.getAttribute('data-v');
              answers[q.key] = v; b.classList.add('on');
              track('QuizAnswer', { key: q.key, value: v });
              timers.push(setTimeout(next, 200));
            };
          });
        } else {
          stage.querySelectorAll('[data-m]').forEach(function (b) {
            b.onclick = function () {
              var v = b.getAttribute('data-m'), i = multiSel.indexOf(v);
              if (i >= 0) multiSel.splice(i, 1); else multiSel.push(v);
              var on = multiSel.indexOf(v) >= 0;
              b.classList.toggle('on', on); b.querySelector('.qz-check').classList.toggle('on', on);
              document.getElementById('cont').disabled = multiSel.length === 0;
            };
          });
          document.getElementById('cont').onclick = function () {
            answers[q.key] = multiSel.slice();
            track('QuizAnswer', { key: q.key, value: multiSel.join(',') });
            multiSel = []; next();
          };
        }
      } else if (p === ANALYZE) {
        var t0 = performance.now(), pct = document.getElementById('pct'), fill = document.getElementById('lfill'),
            c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
        var tick = function (now) {
          var v = Math.min(100, Math.round((now - t0) / 2600 * 100));
          pct.textContent = v + '%'; fill.style.width = v + '%';
          c1.classList.toggle('on', v > 20); c2.classList.toggle('on', v > 60);
          if (v < 100) timers.push(requestAnimationFrame(tick)); else timers.push(setTimeout(next, 250));
        };
        timers.push(requestAnimationFrame(tick));
      } else {
        var s = 30, sec = document.getElementById('sec');
        timers.push(setInterval(function () { s = s > 0 ? s - 1 : 0; sec.textContent = String(s).padStart(2, '0'); }, 1000));
        document.getElementById('unlock').onclick = function () {
          try { sessionStorage.setItem('mom_quiz', JSON.stringify(answers)); } catch (e) {}
          track('QuizComplete', {});
          window.location.href = NEXT_URL + window.location.search;
        };
      }
    }

    go(0);
  })();
  </script>
</body>
</html>
