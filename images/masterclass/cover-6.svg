<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#0d1711"/>
<g stroke="#2a3826" stroke-width="1" opacity="0.6"><line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="450" x2="800" y2="450"/></g>

<rect x="30" y="40" width="740" height="420" rx="16" fill="#152219" stroke="#2a3826"/>
<circle cx="54" cy="56" r="5" fill="#ff5c5c"/><circle cx="72" cy="56" r="5" fill="#f5c451"/><circle cx="90" cy="56" r="5" fill="#2ee66b"/>

<!-- LIVE badge + picked trader -->
<g transform="translate(600 46)">
  <rect width="150" height="22" rx="11" fill="#ff5c5c" fill-opacity="0.16" stroke="#ff5c5c" stroke-opacity="0.6"/>
  <circle cx="16" cy="11" r="4" fill="#ff5c5c"/>
  <text x="28" y="15.5" fill="#ff8c8c" font-family="'JetBrains Mono', Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.5">LIVE BREAKDOWN</text>
</g>

<!-- Chart panel -->
<rect x="50" y="84" width="470" height="356" rx="12" fill="#0f1a13" stroke="#2a3826"/>
<text x="70" y="112" fill="#8fa08f" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" letter-spacing="2">YOUR CHART · NQ 5M</text>

<g stroke-width="2">
  <!-- candles: x, open/close body, wicks -->
  <g stroke="#2ee66b" fill="#2ee66b">
    <line x1="90" y1="330" x2="90" y2="380"/><rect x="83" y="340" width="14" height="30"/>
    <line x1="120" y1="300" x2="120" y2="350"/><rect x="113" y="310" width="14" height="30"/>
    <line x1="210" y1="250" x2="210" y2="305"/><rect x="203" y="260" width="14" height="35"/>
    <line x1="240" y1="215" x2="240" y2="270"/><rect x="233" y="225" width="14" height="35"/>
    <line x1="360" y1="240" x2="360" y2="300"/><rect x="353" y="250" width="14" height="40"/>
    <line x1="390" y1="200" x2="390" y2="255"/><rect x="383" y="210" width="14" height="40"/>
    <line x1="420" y1="165" x2="420" y2="220"/><rect x="413" y="175" width="14" height="35"/>
    <line x1="450" y1="140" x2="450" y2="185"/><rect x="443" y="148" width="14" height="30"/>
  </g>
  <g stroke="#ff5c5c" fill="#ff5c5c">
    <line x1="150" y1="295" x2="150" y2="340"/><rect x="143" y="305" width="14" height="25"/>
    <line x1="180" y1="290" x2="180" y2="335"/><rect x="173" y="300" width="14" height="25"/>
    <line x1="270" y1="220" x2="270" y2="275"/><rect x="263" y="230" width="14" height="35"/>
    <line x1="300" y1="250" x2="300" y2="320"/><rect x="293" y="262" width="14" height="45"/>
    <line x1="330" y1="270" x2="330" y2="330"/><rect x="323" y="280" width="14" height="38"/>
  </g>
</g>

<!-- Their entry + stop that got hit -->
<line x1="230" y1="232" x2="340" y2="232" stroke="#f3f7f3" stroke-dasharray="5 5" stroke-width="1.5"/>
<text x="70" y="236" fill="#f3f7f3" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Their entry</text>
<line x1="230" y1="325" x2="340" y2="325" stroke="#ff5c5c" stroke-dasharray="5 5" stroke-width="1.5"/>
<text x="196" y="348" fill="#ff8c8c" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Stop too tight</text>
<g transform="translate(354 325)" stroke="#ff5c5c" stroke-width="4" stroke-linecap="round"><line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/></g>

<!-- Markup circle on the mistake -->
<ellipse cx="285" cy="262" rx="70" ry="58" fill="none" stroke="#f5c451" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>

<!-- Notes panel -->
<rect x="540" y="84" width="210" height="356" rx="12" fill="#0f1a13" stroke="#2a3826"/>
<text x="560" y="112" fill="#8fa08f" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" letter-spacing="2">BREAKDOWN</text>

<g font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <g transform="translate(560 140)">
    <rect width="170" height="78" rx="10" fill="#ff5c5c" fill-opacity="0.1" stroke="#ff5c5c" stroke-opacity="0.45"/>
    <text x="14" y="24" fill="#ff8c8c" font-size="11" font-weight="700" letter-spacing="1.2">THE PROBLEM</text>
    <text x="14" y="46" fill="#f3f7f3" font-size="14" font-weight="600">Entered early,</text>
    <text x="14" y="64" fill="#f3f7f3" font-size="14" font-weight="600">no confirmation</text>
  </g>
  <g transform="translate(560 232)">
    <rect width="170" height="78" rx="10" fill="#2ee66b" fill-opacity="0.1" stroke="#2ee66b" stroke-opacity="0.45"/>
    <text x="14" y="24" fill="#2ee66b" font-size="11" font-weight="700" letter-spacing="1.2">THE FIX</text>
    <text x="14" y="46" fill="#f3f7f3" font-size="14" font-weight="600">Wait for the OTE,</text>
    <text x="14" y="64" fill="#f3f7f3" font-size="14" font-weight="600">stop past the swing</text>
  </g>
  <g transform="translate(560 336)">
    <circle cx="20" cy="20" r="20" fill="#2a3826"/>
    <circle cx="20" cy="15" r="7" fill="#8fa08f"/>
    <path d="M7 34 Q20 21 33 34" fill="#8fa08f"/>
    <text x="52" y="16" fill="#8fa08f" font-size="11" font-weight="700" letter-spacing="1.2">PICKED LIVE</text>
    <text x="52" y="35" fill="#f3f7f3" font-size="15" font-weight="700">From the room</text>
  </g>
  <text x="560" y="420" fill="#8fa08f" font-size="12">Your charts. Your trades.</text>
</g>
</svg>
